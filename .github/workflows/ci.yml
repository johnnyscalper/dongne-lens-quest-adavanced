name: Check app
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and HTTP integration tests
        run: python -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/mobile.js
          node --check public/journey.js
          node --check public/labs.js
          node --check public/local-analytics.js
          node --check public/local-insights.js
          node --check public/local-api.js
      - name: Rebuild standalone app and verify committed copy
        run: |
          python3 build_static.py
          python3 build_static.py --check
          git diff --exit-code -- play.html
